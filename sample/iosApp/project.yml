name: LottoriSample
options:
  bundleIdPrefix: com.ycgc.lottori
  deploymentTarget:
    iOS: "16.0"
settings:
  base:
    SWIFT_VERSION: "5.0"
    ENABLE_USER_SCRIPT_SANDBOXING: NO
targets:
  LottoriSample:
    type: application
    platform: iOS
    sources: [Sources]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.ycgc.lottori.sample
        PRODUCT_NAME: LottoriSample
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_UIApplicationSceneManifest_Generation: YES
        INFOPLIST_KEY_CFBundleDisplayName: Lottori
        INFOPLIST_FILE: Info.plist
        FRAMEWORK_SEARCH_PATHS: "$(inherited) $(SRCROOT)/../build/xcode-frameworks/$(CONFIGURATION)/$(SDK_NAME)"
        OTHER_LDFLAGS: "$(inherited) -framework LottoriSampleKit"
    preBuildScripts:
      - name: Build Kotlin framework and copy sample fixtures
        basedOnDependencyAnalysis: false
        script: |
          set -eu
          cd "$SRCROOT/../.."
          ./gradlew :sample:embedAndSignAppleFrameworkForXcode :sample:prepareSampleAssets
          mkdir -p "$TARGET_BUILD_DIR/$UNLOCALIZED_RESOURCES_FOLDER_PATH/Fixtures"
          assets="sample/build/sample-assets/${ORG_GRADLE_PROJECT_lottoriSampleMode:-demo}"
          mkdir -p "$assets"
          /usr/bin/rsync -a --delete "${assets}/" "$TARGET_BUILD_DIR/$UNLOCALIZED_RESOURCES_FOLDER_PATH/Fixtures/"
  LottoriSampleUITests:
    type: bundle.ui-testing
    platform: iOS
    sources: [UITests]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.ycgc.lottori.sample.uitests
        GENERATE_INFOPLIST_FILE: YES
    dependencies:
      - target: LottoriSample
schemes:
  LottoriSample:
    build:
      targets:
        LottoriSample: all
    test:
      targets: [LottoriSampleUITests]
